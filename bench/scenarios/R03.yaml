id: R03
title: Slow viewer - one WebRTC viewer behind netem (2 % loss, 300 ms), the others unaffected
measures: [delivery, latency]
status: needs-linux
reason: >
  netem shapes one viewer's traffic only on Linux (tc qdisc on a veth or a
