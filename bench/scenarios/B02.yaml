id: B02
title: One H.265 camera, one WebRTC viewer through the H.264 transcode
measures: [cpu, rss, first_frame, latency, transcode_cost]
status: ready
notes: >
  The viewer asks for the H.264 transcode of the camera; the difference in
  tree CPU against B01 at the same size is the transcode's cost. There is no
  H.265 viewer: Edge 157 offers no H.265 in WebRTC, headless or not (measured
  2026-11-14 with RTCRtpReceiver.getCapabilities and createOffer), so a copy
  viewer of an H.265 camera never receives a packet. MediaMTX runs the
  transcode as an FFmpeg spawned by runOnDemand.
duration_s: 60
cameras:
  count: 1
  profile: {codec: h265, width: 1920, height: 1080, fps: "25", gop: 25}
webrtc:
  - {cameras: all, per_camera: 1, want: h264, decode_first: 1}
