[package]
name = "oxrtc-http-client"
description = "Camera ingest for oxrtc: http(s):// sources, Motion JPEG as multipart/x-mixed-replace or as a JPEG polled."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/iyotee/oxrtc"

[dependencies]
oxrtc-core.workspace = true
bytes = "1.12"
tokio = { version = "1.54", default-features = false, features = ["time", "macros", "rt", "net"] }
tracing = "0.1"
thiserror = "2"
url = "2.5"
percent-encoding = "2.3"
memchr = "2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# The same Basic and Digest client retina uses for RTSP: already in the graph.
http-auth = "0.1.10"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-native-certs = "0.8"

[features]
# Exposes the `fuzzing` harness to the cargo-fuzz target in `fuzz/`. Never
# enabled by a build of the server.
fuzzing = []

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["time", "macros", "rt", "rt-multi-thread", "net", "io-util", "sync"] }
proptest = "1"
# The fake cameras of the integration tests: a Digest verifier written from
# the RFC (md-5 and base64 are already in the graph, through http-auth and the
# API), and a certificate for the `https` ones (rcgen is dimpl's, on the same
# aws-lc-rs feature).
md-5 = "0.10"
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }

[lints]
workspace = true
