[package]
name = "oxrtc-api"
description = "Configuration loader and go2rtc-compatible HTTP API of oxrtc."
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/iyotee/oxrtc"

[dependencies]
oxrtc-core.workspace = true
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.6.6", default-features = false, features = ["timeout", "limit"] }
tokio = { version = "1.54", default-features = false, features = ["net", "rt", "sync", "time", "macros"] }
bytes = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
form_urlencoded = "1"
base64 = "0.22"
subtle = "2.6"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
