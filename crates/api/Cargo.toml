[package]
name = "oxrtc-api"
description = "Configuration loader and go2rtc-compatible HTTP API of oxrtc."
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/iyotee/oxrtc"

[dependencies]
oxrtc-core.workspace = true
# The fragmented MP4 of `mse` over `/api/ws` (F3) and of `stream.mp4` (F4).
oxrtc-mp4.workspace = true
oxrtc-mpegts.workspace = true
# `stream.mp4`'s body, a stream of fragments (`Body::from_stream`); already
# in the graph through axum and the core.
futures-util.workspace = true
# `ws`: go2rtc's WebSocket API (`/api/ws`, F2). It brings tokio-tungstenite,
# the WebSocket implementation axum's own upgrade is written over (D39).
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio", "ws"] }
tower-http = { version = "0.6.6", default-features = false, features = ["timeout", "limit"] }
tokio = { version = "1.54", default-features = false, features = ["net", "rt", "sync", "time", "macros"] }
bytes = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
form_urlencoded = "1"
base64 = "0.22"
subtle = "2.6"
# The id of an HLS session, the capability its routes are read with (F6,
# D47): 128 bits from the operating system, as the WebRTC and RTSP crates
# draw theirs; already in the graph.
getrandom = "0.3"
tracing = "0.1"
thiserror = "2"

[features]
# The harness of the fuzz targets (`fuzz/`): the parser of `/api/ws`'s
# messages. Never enabled by a build of the server.
fuzzing = []

[dev-dependencies]
# Its test reader of the box tree, to read back what `mse` sent.
oxrtc-mp4 = { workspace = true, features = ["fuzzing"] }
# Its test reader of transport streams, to read back HLS's MPEG-TS segments.
oxrtc-mpegts = { workspace = true, features = ["fuzzing"] }
proptest.workspace = true
# The WebSocket client of the `/api/ws` tests (already in the graph through
# axum's `ws`).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util.workspace = true
tokio = { version = "1.54", default-features = false, features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
