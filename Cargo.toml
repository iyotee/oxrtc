[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# A patched dependency, not a member: see third_party/README.md.
exclude = ["third_party/h264-reader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/iyotee/oxrtc"

[workspace.dependencies]
oxrtc-core = { path = "crates/core", version = "0.1.0" }

bytes = "1.12"
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
thiserror = "2"
fastrand = "2"
proptest = "1"

# h264-reader 0.9.0 with two level checks relaxed (third_party/README.md):
# retina parses every H.264 SPS with it, and refused streams whose picture
# exceeds the declared level.
[patch.crates-io]
h264-reader = { path = "third_party/h264-reader" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Network input is never trusted: no panicking accessors outside tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
