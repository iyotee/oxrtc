# A release per `v*` tag: the binary for linux-amd64, linux-arm64 (Raspberry
# Pi 5, and any 64-bit ARM Linux) and windows-amd64, each archive with the
# third-party notices, a CycloneDX SBOM per binary of exactly what was
# compiled for its target, and a SHA256SUMS file covering every asset. A
# manual run builds the same assets without publishing them. The same
# assets build on a developer's machine: scripts/release_local.py.
#
# This workflow is what publishes a release (docs/DECISIONS.md, D33). A tag
# that already has one - made from a developer's machine because Actions could
# not run - is left alone: nothing is built, nothing is published, and a
# release's assets, with the checksums pinned on them elsewhere, never change.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.look.outputs.released }}
    steps:
      - name: Is this tag released already?
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] \
            && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME already has a release: nothing is built or published."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.released != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, so the binaries also run on Debian 12 /
          # Raspberry Pi OS Bookworm (2.36) and anything newer.
          - platform: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - platform: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - platform: windows-amd64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustup show active-toolchain

      # aws-lc-sys (through str0m's DTLS) compiles C: a cross build needs the
      # cross C compiler as well as the linker.
      - name: Cross compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      # cargo-about writes the third-party notices each archive carries (R16),
      # cargo-cyclonedx the SBOMs. The versions are scripts/release_local.py's.
      - name: Tools
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx@0.5.10
          cargo install --locked cargo-about@0.9.3 --features cli

      # The same script a release built on a developer's machine runs: the
      # build (oxrtc-exec beside oxrtc on Linux, docs/ARCHITECTURE.md
      # "Processes"), the checks of each binary, the SBOMs, the notices and
      # the archive. SHA256SUMS is the publish job's, over every platform.
      - name: Build and package
        shell: bash
        run: |
          py=python3
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; fi
          "$py" scripts/release_local.py --platform "${{ matrix.platform }}" --version "$GITHUB_REF_NAME" \
            --builder cargo --no-sums --out dist
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Binaries for linux-amd64, linux-arm64 and windows-amd64 with their third-party notices, a CycloneDX SBOM per binary, and SHA256SUMS." \
            -- *

      - name: Keep the assets of a manual run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist/*
