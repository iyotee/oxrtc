[package]
name = "oxrtc-fuzz"
description = "cargo-fuzz targets of oxrtc: the parsers and packetizers that read the network."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: libFuzzer needs a nightly compiler and sanitizer flags
# the main workspace must never be built with.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
oxrtc-core = { path = "../crates/core" }
oxrtc-http-client = { path = "../crates/http-client", features = ["fuzzing"] }
oxrtc-rtsp-server = { path = "../crates/rtsp-server", features = ["fuzzing"] }
oxrtc-webrtc = { path = "../crates/webrtc", features = ["fuzzing"] }

# The same patched h264-reader as the main workspace (third_party/README.md),
# so the fuzzers exercise the code that ships.
[patch.crates-io]
h264-reader = { path = "../third_party/h264-reader" }

[profile.release]
debug = 1

[[bin]]
name = "rtsp_request"
path = "fuzz_targets/rtsp_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdp_announce"
path = "fuzz_targets/sdp_announce.rs"
test = false
doc = false
bench = false

